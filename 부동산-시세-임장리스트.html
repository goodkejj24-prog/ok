    function formatPrice(manwon) {
      if (manwon === 0) return "0만";
      const absVal = Math.abs(manwon);
      const sign = manwon < 0 ? "-" : "";
      const eok = Math.floor(absVal / 10000);
      const remainder = absVal % 10000;
      if (eok > 0 && remainder > 0) {
        return `${sign}${eok}억 ${remainder.toLocaleString()}만`;
      } else if (eok > 0) {
        return `${sign}${eok}억`;
      } else {
        return `${sign}${remainder.toLocaleString()}만`;
      }
    }

    function PriceChangeIndicator({ change, changeRate }) {
      if (change > 0) {
        return (
          <span className="inline-flex items-center text-red-500 text-sm font-semibold">
            <span className="mr-0.5">&#9650;</span>
            {formatPrice(change)} ({changeRate > 0 ? "+" : ""}{changeRate}%)
          </span>
        );
      } else if (change < 0) {
        return (
          <span className="inline-flex items-center text-blue-500 text-sm font-semibold">
            <span className="mr-0.5">&#9660;</span>
            {formatPrice(Math.abs(change))} ({changeRate}%)
          </span>
        );
      } else {
        return (
          <span className="inline-flex items-center text-gray-400 text-sm font-semibold">
            &#8212; 변동없음
          </span>
        );
      }
    }

    function ScoreBar({ score, max = 100 }) {
      const pct = Math.min((score / max) * 100, 100);
      let color = "bg-red-400";
      if (score >= 80) color = "bg-emerald-500";
      else if (score >= 70) color = "bg-blue-500";
      else if (score >= 60) color = "bg-yellow-500";
      return (
        <div className="flex items-center gap-2 flex-1">
          <div className="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
            <div className={`h-full rounded-full ${color}`} style={{ width: `${pct}%` }} />
          </div>
          <span className="text-sm font-bold text-gray-700 w-8 text-right">{score}</span>
        </div>
      );
    }

    function RankBadge({ rank }) {
      const colors = {
        1: "bg-yellow-400 text-yellow-900",
        2: "bg-gray-300 text-gray-700",
        3: "bg-amber-600 text-amber-50"
      };
      return (
        <span className={`inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold ${colors[rank] || "bg-gray-200 text-gray-600"}`}>
          #{rank}
        </span>
      );
    }

              <div className="text-center">
                <p className="text-xs text-gray-400 mb-0.5">난방</p>
                <p className="text-sm font-semibold text-gray-700">{m.heatingType}</p>
              </div>
              <div className="text-center">
                <p className="text-xs text-gray-400 mb-0.5">관리비</p>
                <p className="text-sm font-semibold text-gray-700">{m.avgMaintenanceFee}만</p>
              </div>
              <div className="text-center">
                <p className="text-xs text-gray-400 mb-0.5">방/면적</p>
                <p className="text-sm font-semibold text-gray-700">{m.roomCount}룸/{pyeong}평</p>
              </div>
              <div className="text-center">
                <p className="text-xs text-gray-400 mb-0.5">종합점수</p>
                <p className="text-sm font-extrabold text-indigo-600">{data.totalScore}점</p>
              </div>
            </div>
          </div>

          <div className="border-t border-gray-100 mx-5" />

          {/* Infrastructure */}
          <div className="px-5 py-3 pb-5">
            <div className="flex items-center gap-4 mb-2">
              <div className="flex items-center gap-1.5">
                <span className="text-sm">&#128643;</span>
                <span className="text-sm text-gray-700 font-medium">{m.nearestStation}</span>
                <span className="text-xs text-gray-400">도보 {m.stationWalkMin}분</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="text-sm">&#128664;</span>
                <span className="text-xs text-gray-500">강남역 {m.gangnamCommuteMin}분</span>
              </div>
            </div>
            <div className="flex flex-wrap gap-1.5">
              {m.schools.map((s, i) => (
                <span key={i} className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${
                  s.type === "초" ? "bg-green-50 text-green-700" :
                  s.type === "중" ? "bg-blue-50 text-blue-700" :
                  "bg-purple-50 text-purple-700"
                }`}>
                  {s.name} {s.distance}
                </span>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const REGIONS = ["평촌", "용인", "금천", "중랑"];
    const SORT_OPTIONS = [
      { value: "rank", label: "종합랭킹순" },
      { value: "popularity", label: "선호도순" },
      { value: "investment", label: "실투자금순" },
      { value: "price", label: "매매가순" },
      { value: "jeonseRate", label: "전세가율순" },
      { value: "gap", label: "갭순" }
    ];

    function Dashboard() {
      const [selectedRegion, setSelectedRegion] = useState("평촌");
      const [sortBy, setSortBy] = useState("rank");

      const filtered = useMemo(() => {
        let items = APARTMENTS.filter(a => a.master.region === selectedRegion);
        switch (sortBy) {
          case "rank": items.sort((a, b) => a.rankRegion - b.rankRegion); break;
          case "popularity": items.sort((a, b) => b.naverInterestCount - a.naverInterestCount); break;
          case "investment": items.sort((a, b) => a.realInvestment - b.realInvestment); break;
          case "price": items.sort((a, b) => b.currentPrice - a.currentPrice); break;
          case "jeonseRate": items.sort((a, b) => b.jeonseRate - a.jeonseRate); break;
          case "gap": items.sort((a, b) => a.gap - b.gap); break;
        }
        return items;
      }, [selectedRegion, sortBy]);

      return (
        <div className="min-h-screen bg-slate-50">
          {/* Header */}
          <div className="bg-white border-b border-gray-200 sticky top-0 z-20">
            <div className="max-w-3xl mx-auto px-4 py-4">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-xl font-extrabold text-gray-900">부동산 시세 임장리스트</h1>
                  <p className="text-xs text-gray-400 mt-0.5">03/17 06:00 업데이트</p>
                </div>
                <div className="flex items-center gap-1 bg-indigo-50 px-3 py-1.5 rounded-full">
                  <span className="text-sm">&#127968;</span>
                  <span className="text-sm font-bold text-indigo-700">총 {filtered.length}개 매물</span>
                </div>
              </div>
            </div>
          </div>

          {/* Region Tabs */}
          <div className="bg-white border-b border-gray-200 sticky top-[73px] z-10">
            <div className="max-w-3xl mx-auto px-4">
              <div className="flex gap-1 hide-scrollbar overflow-x-auto py-2">
                {REGIONS.map(region => (
                  <button
                    key={region}
                    onClick={() => setSelectedRegion(region)}
                    className={`px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap transition-all ${
                      selectedRegion === region
                        ? "bg-indigo-600 text-white shadow-md"
                        : "bg-gray-100 text-gray-600 hover:bg-gray-200"
                    }`}
                  >
                    {region === "중랑" ? "중랑구" : region}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Sort + Content */}
          <div className="max-w-3xl mx-auto px-4 py-4">
            <div className="flex items-center justify-between mb-4">
              <span className="text-sm text-gray-500 font-medium">
                {selectedRegion === "중랑" ? "중랑구" : selectedRegion} 지역 매물
              </span>
              <select
                value={sortBy}
                onChange={e => setSortBy(e.target.value)}
                className="text-sm bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                {SORT_OPTIONS.map(opt => (
                  <option key={opt.value} value={opt.value}>{opt.label}</option>
                ))}
              </select>
            </div>

            <div className="space-y-4">
              {filtered.map(apt => (
                <ApartmentCard key={apt.masterId} data={apt} />
              ))}
            </div>

            {filtered.length === 0 && (
              <div className="text-center py-16 text-gray-400">
                <p className="text-lg">해당 지역의 매물이 없습니다.</p>
              </div>
            )}
          </div>

          {/* Footer */}
          <div className="max-w-3xl mx-auto px-4 py-8 text-center">
            <p className="text-xs text-gray-300">부동산 시세 임장리스트 &copy; 2026</p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Dashboard />);
  </script>
</body>
</html>
